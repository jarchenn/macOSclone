# Limine configuration for Aurora OS (syntax: Limine 12.x CONFIG.md)
timeout: 1
interface_branding: Aurora OS boot
interface_branding_colour: 7fb4ff

/Aurora OS 0.1
    protocol: limine
    path: boot():/boot/aurora/kernel.elf
    module_path: boot():/boot/aurora/initramfs.img
    module_string: initramfs
    resolution: 1024x768x32
